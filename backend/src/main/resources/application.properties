spring.profiles.active=${SPRING_PROFILE:local}
spring.application.name=trampo

spring.datasource.url=jdbc:mysql://localhost:3306/trampo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_SENHA:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

trampo.jwt.secret=${JWT_SECRET:}
trampo.jwt.expiration=86400000

trampo.cors.origins=*

trampo.admin.email=${ADMIN_EMAIL:admin@trampo.com}
trampo.admin.senha=${ADMIN_SENHA:}