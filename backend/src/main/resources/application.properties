spring.application.name=trampo
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trampo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.time-zone=America/Sao_Paulo

trampo.jwt.secret=${JWT_SECRET:trampo-dev-secret-com-32-caracteres-2026}
trampo.jwt.expiration=${JWT_EXPIRATION:86400000}

trampo.cors.origins=${CORS_ORIGINS:*}

trampo.admin.email=${ADMIN_EMAIL:}
trampo.admin.senha=${ADMIN_SENHA:}
